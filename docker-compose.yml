services:
 
  travel-app:
  
    image: ${DOCKER_USER}/meen-travel-app:v${TAG}

    # container_name: travel_app    *let docker-compose assign a name automatically*
    ports:
     - "8085:80"

    environment:
     DB_HOST: ${DB_HOST}
     DB_PORT: ${DB_PORT}
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  
    networks:
      - travel-network

    depends_on:
      travel_db:
       condition: service_healthy

    restart: unless-stopped

  

  travel_db:
   image: postgres:15-alpine

  #  container_name: travel-compose-db  *let docker-compose assign a name automatically*

   environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  

   volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

   networks:
      - travel-network
    
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

   restart: always

volumes:
  pgdata:
    driver: local


networks:
  travel-network:
    driver: bridge
